# ---------------------------------------------------------------------------
# Nova Mart — MySQL deployment of the full platform.
#
#   docker compose -f docker-compose.mysql.yml up --build
#
#   Storefront        http://localhost:3000
#   Admin dashboard   http://localhost:3000/admin
#   API gateway       http://localhost:8080/api/v1
#   Swagger (per service) http://localhost:808X/swagger-ui.html
# ---------------------------------------------------------------------------

name: novamart-mysql

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [novamart]
  environment: &service-env
    SPRING_PROFILES_ACTIVE: docker
    DB_USERNAME: ${MYSQL_USER:-novamart}
    DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required, see .env.example}
    NOVAMART_JWT_SECRET: ${NOVAMART_JWT_SECRET:?NOVAMART_JWT_SECRET is required, see .env.example}
    NOVAMART_INTERNAL_TOKEN: ${NOVAMART_INTERNAL_TOKEN:?NOVAMART_INTERNAL_TOKEN is required, see .env.example}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-service-build: &service-build
  context: .
  dockerfile: infrastructure/docker/service.Dockerfile

services:

  # ------------------------------------------------------------- MySQL Database --
  mysql:
    image: mysql:8.4
    container_name: novamart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required, see .env.example}
      MYSQL_USER: ${MYSQL_USER:-novamart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required, see .env.example}
      MYSQL_DATABASE: auth_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/docker/mysql/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "novamart", "-p${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [novamart]

  # ------------------------------------------------------ auth-service --
  auth-service:
    <<: *service-defaults
    container_name: novamart-auth-service
    build:
      <<: *service-build
      args:
        MODULE: services/auth-service
        ARTIFACT: auth-service
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  # ------------------------------------------------------ product-service --
  product-service:
    <<: *service-defaults
    container_name: novamart-product-service
    build:
      <<: *service-build
      args:
        MODULE: services/product-service
        ARTIFACT: product-service
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      INVENTORY_SERVICE_URL: http://inventory-service:8086
    volumes:
      - product-uploads:/app/uploads
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

  # ------------------------------------------------------ cart-service --
  cart-service:
    <<: *service-defaults
    container_name: novamart-cart-service
    build:
      <<: *service-build
      args:
        MODULE: services/cart-service
        ARTIFACT: cart-service
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/cart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8086
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy

  # ------------------------------------------------------ order-service --
  order-service:
    <<: *service-defaults
    container_name: novamart-order-service
    build:
      <<: *service-build
      args:
        MODULE: services/order-service
        ARTIFACT: order-service
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      DB_URL: jdbc:mysql://mysql:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      CART_SERVICE_URL: http://cart-service:8083
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      AUTH_SERVICE_URL: http://auth-service:8081
      FREE_DELIVERY_THRESHOLD: ${FREE_DELIVERY_THRESHOLD:-999.00}
      DELIVERY_FEE: ${DELIVERY_FEE:-79.00}
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy

  # ------------------------------------------------------ payment-service --
  payment-service:
    <<: *service-defaults
    container_name: novamart-payment-service
    build:
      <<: *service-build
      args:
        MODULE: services/payment-service
        ARTIFACT: payment-service
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      DB_URL: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy

  # ------------------------------------------------------ inventory-service --
  inventory-service:
    <<: *service-defaults
    container_name: novamart-inventory-service
    build:
      <<: *service-build
      args:
        MODULE: services/inventory-service
        ARTIFACT: inventory-service
    environment:
      <<: *service-env
      SERVER_PORT: 8086
      DB_URL: jdbc:mysql://mysql:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy

  # ------------------------------------------------------ notification-service --
  notification-service:
    <<: *service-defaults
    container_name: novamart-notification-service
    build:
      <<: *service-build
      args:
        MODULE: services/notification-service
        ARTIFACT: notification-service
    environment:
      <<: *service-env
      SERVER_PORT: 8087
      DB_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy

  # -------------------------------------------------------- API Gateway --
  api-gateway:
    <<: *service-defaults
    container_name: novamart-api-gateway
    build:
      <<: *service-build
      args:
        MODULE: api-gateway
        ARTIFACT: api-gateway
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  # ----------------------------------------------------------- Frontend --
  frontend:
    container_name: novamart-frontend
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [novamart]

networks:
  novamart:
    driver: bridge

volumes:
  mysql-data:
  product-uploads:
