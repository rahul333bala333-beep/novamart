# product-service - `local` profile: in-memory H2, no external services required.
# See services/auth-service/src/main/resources/application-local.yml for the
# rationale behind the development-only credentials below.

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:zeno7925}

novamart:
  jwt:
    secret: novamart-local-development-signing-key-not-for-production
  internal:
    token: novamart-local-internal-token

logging:
  level:
    com.novamart: DEBUG
