# payment-service - `docker` profile.
#
# Selected by SPRING_PROFILES_ACTIVE=docker in docker-compose.yml. Everything
# that differs from the default profile is supplied by the environment, so this
# file only needs to say what Docker changes: bind to all interfaces and expose
# readiness probes for the compose health gate.

server:
  address: 0.0.0.0

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: WARN
    com.novamart: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
