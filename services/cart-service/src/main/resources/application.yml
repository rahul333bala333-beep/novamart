# cart-service - default (PostgreSQL) profile.

server:
  port: ${SERVER_PORT:8083}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: cart-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:zeno7925}
    hikari:
      pool-name: cart-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: VARCHAR
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

novamart:
  jwt:
    secret: ${NOVAMART_JWT_SECRET}
    issuer: novamart
  internal:
    token: ${NOVAMART_INTERNAL_TOKEN}
  services:
    product-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.novamart: ${LOG_LEVEL:INFO}
