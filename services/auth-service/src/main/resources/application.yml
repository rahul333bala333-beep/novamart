# auth-service - default (PostgreSQL) profile.
#
# Every value that differs between environments is an environment variable with a
# development-friendly default. Secrets are the exception: NOVAMART_JWT_SECRET and
# NOVAMART_INTERNAL_TOKEN have no default here on purpose, so a deployment that
# forgets them fails loudly at startup instead of running on a value that is
# published in this repository.

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:zeno7925}
    hikari:
      pool-name: auth-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    open-in-view: false          # a request must not hold a database connection while rendering
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: VARCHAR
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

novamart:
  jwt:
    secret: ${NOVAMART_JWT_SECRET}
    issuer: novamart
    access-token-ttl: 1h
    refresh-token-ttl: 14d
  internal:
    token: ${NOVAMART_INTERNAL_TOKEN}
    connect-timeout: 2s
    read-timeout: 5s
  services:
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.novamart: ${LOG_LEVEL:INFO}
