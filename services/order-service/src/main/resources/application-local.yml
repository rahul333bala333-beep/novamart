# order-service - `local` profile: in-memory H2.
#
# Checkout coordinates five services, so placing an order in this profile
# requires auth, product, cart, inventory, payment and notification to be running
# too. `docker compose up` is the easier route; see the README.

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:zeno7925}

novamart:
  jwt:
    secret: novamart-local-development-signing-key-not-for-production
  internal:
    token: novamart-local-internal-token

logging:
  level:
    com.novamart: DEBUG
