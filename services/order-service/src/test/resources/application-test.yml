# Test profile: in-memory H2 running the real Flyway migrations.
#
# Testing against the actual migration history rather than `ddl-auto: create`
# means a migration that is wrong fails a test instead of failing a deployment.
# The database name is unique per service so parallel modules cannot collide.

spring:
  datasource:
    url: jdbc:h2:mem:order_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

novamart:
  jwt:
    secret: test-only-signing-key-at-least-32-bytes-long-for-hs256
    issuer: novamart
    access-token-ttl: 1h
    refresh-token-ttl: 14d
  internal:
    token: test-internal-token
  services:
    auth-url: http://localhost:19999
    cart-url: http://localhost:19999
    product-url: http://localhost:19999
    inventory-url: http://localhost:19999
    payment-url: http://localhost:19999
    notification-url: http://localhost:19999

logging:
  level:
    root: WARN
    com.novamart: INFO
