# api-gateway - the single entry point for every client.

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        # Longer than an individual service call because checkout fans out to
        # five services behind one request. Still bounded: an unbounded read
        # timeout is how one slow service exhausts the gateway's connections.
        response-timeout: 15s

novamart:
  # The gateway verifies tokens to stamp trusted identity headers. It shares the
  # signing secret with auth-service but never issues anything itself.
  jwt:
    secret: ${NOVAMART_JWT_SECRET}
    issuer: novamart
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    product-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    cart-url: ${CART_SERVICE_URL:http://localhost:8083}
    order-url: ${ORDER_SERVICE_URL:http://localhost:8084}
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
    inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8086}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.novamart: ${LOG_LEVEL:INFO}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}
