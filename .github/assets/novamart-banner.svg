<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080b22"/>
      <stop offset="0.5" stop-color="#0d1230"/>
      <stop offset="1" stop-color="#141a4a"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8be9fd">
        <animate attributeName="stop-color" values="#8be9fd;#c4b5fd;#8be9fd" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#22d3ee;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wordclip">
      <text x="640" y="205" text-anchor="middle" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
    </clipPath>
    <g id="cube">
      <polygon points="0,-24 42,0 0,24 -42,0" fill="currentColor"/>
      <polygon points="-42,0 0,24 0,72 -42,48" fill="currentColor" fill-opacity="0.42"/>
      <polygon points="42,0 0,24 0,72 42,48" fill="currentColor" fill-opacity="0.68"/>
      <polyline points="0,-24 42,0 0,24 -42,0 0,-24" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>
      <line x1="0" y1="24" x2="0" y2="72" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="18" fill="none" stroke="#2a3170" stroke-width="1.5"/>

  <!-- pulsing glows -->
  <ellipse cx="250" cy="120" rx="360" ry="260" fill="url(#glowViolet)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1050" cy="300" rx="380" ry="280" fill="url(#glowCyan)">
    <animate attributeName="opacity" values="1;0.5;1" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- isometric grid floor -->
  <g stroke="#3a428f" stroke-opacity="0.35" stroke-width="1">
    <path d="M0 300 L1280 300"/>
    <path d="M0 330 L1280 330"/>
    <path d="M0 362 L1280 362"/>
    <path d="M120 300 L40 400"/><path d="M300 300 L250 400"/><path d="M480 300 L460 400"/>
    <path d="M660 300 L670 400"/><path d="M840 300 L880 400"/><path d="M1020 300 L1090 400"/>
    <path d="M1200 300 L1300 400"/>
  </g>

  <!-- floating service cubes (bobbing, staggered phases) -->
  <g transform="translate(150,150)">
    <g transform="scale(0.85)"><use href="#cube" color="#22d3ee"/></g>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0; 0 -14; 0 0" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </g>
  <g transform="translate(1120,160)">
    <g transform="scale(0.95)"><use href="#cube" color="#a855f7"/></g>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0; 0 -16; 0 0" dur="5s" begin="-1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </g>
  <g transform="translate(1180,270)">
    <g transform="scale(0.6)"><use href="#cube" color="#38bdf8"/></g>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0; 0 -10; 0 0" dur="3.6s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </g>
  <g transform="translate(90,275)">
    <g transform="scale(0.55)"><use href="#cube" color="#f472b6"/></g>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0; 0 -11; 0 0" dur="4.6s" begin="-2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </g>

  <!-- extruded 3D wordmark: NOVAMART -->
  <g transform="translate(640,205)" text-anchor="middle">
    <g fill="#3b1d6e">
      <text x="1.6" y="1.9" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="3.2" y="3.8" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="4.8" y="5.7" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="6.4" y="7.6" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="8.0" y="9.5" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="9.6" y="11.4" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="11.2" y="13.3" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="12.8" y="15.2" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="14.4" y="17.1" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="16.0" y="19.0" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="17.6" y="20.9" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
      <text x="19.2" y="22.8" font-size="118" font-weight="900" letter-spacing="2">NOVAMART</text>
    </g>
    <text x="0" y="0" font-size="118" font-weight="900" letter-spacing="2" fill="url(#face)" stroke="#0b1030" stroke-width="1.2" paint-order="stroke">NOVAMART</text>
  </g>

  <!-- animated light shimmer sweeping across the wordmark -->
  <g clip-path="url(#wordclip)">
    <rect x="200" y="100" width="150" height="130" fill="url(#shimmer)" transform="skewX(-18)">
      <animate attributeName="x" values="220;1060;1060" keyTimes="0;0.55;1" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tagline -->
  <text x="640" y="280" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="7" fill="#c7d2fe">MICROSERVICES &#183; E&#8209;COMMERCE &#183; CLOUD&#8209;NATIVE</text>
  <text x="640" y="322" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="3" fill="#8b93c7">8 Spring Boot services &#183; API Gateway &#183; Next.js 16 storefront &#183; Distributed Saga</text>
</svg>
